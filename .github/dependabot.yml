version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: gradle
    directories:
      - /kotlin
      - /kotlin/smoke
    schedule:
      interval: weekly
    # Major upgrades need a coordinated toolchain and Android compatibility review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      kotlin:
        group-by: dependency-name
        patterns: ["org.jetbrains.kotlin*"]
      gradle-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["org.jetbrains.kotlin*"]
        update-types: [minor, patch]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns: ["org.jetbrains.kotlin*"]
