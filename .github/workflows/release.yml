name: release
on:
  push: { tags: ['v*'] }
jobs:
  tag-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: assert tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./typescript/package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v${pkg_version}" ]; then
            echo "tag ${tag} does not match typescript/package.json version v${pkg_version}" >&2
            exit 1
          fi
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: mise.toml }
      - run: node fixtures/generate/derive.mjs --check
  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: typescript } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: mise.toml }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node ../fixtures/generate/parity.mjs --check "$GITHUB_SHA" "$GITHUB_SHA"
  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test -c release
  kotlin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kotlin } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - name: Configure JDK 17 toolchain discovery
        run: |
          mkdir -p "$HOME/.gradle"
          echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_17_ARM64' >> "$HOME/.gradle/gradle.properties"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check Gradle daemon JVM
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp check-gradle-jvm.init.gradle "$HOME/.gradle/init.d/check-gradle-jvm.init.gradle"
          echo EXPECTED_GRADLE_JAVA=25 >> "$GITHUB_ENV"
      - run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - run: ./gradlew -p smoke run
      - name: Test source consumer with Gradle on JDK 17
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME_17_ARM64:?JDK 17 not installed}}"
          export EXPECTED_GRADLE_JAVA=17
          mv build/reports build/reports-jdk25
          mv build/test-results build/test-results-jdk25
          ./gradlew -Pkotlin.compiler.execution.strategy=in-process test jacocoTestReport jacocoTestCoverageVerification --rerun-tasks
          ./gradlew -Pkotlin.compiler.execution.strategy=in-process -p smoke run --rerun-tasks
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-reports
          path: |
            kotlin/build/reports*
            kotlin/build/test-results*
  smoke-swiftpm:
    needs: [tag-version, fixtures, typescript, swift, kotlin]
    runs-on: ubuntu-latest
    steps:
      - name: build a scratch package depending on this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/almanac-smoke/Sources/almanac-smoke
          cd /tmp/almanac-smoke
          cat > Package.swift <<EOF
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "almanac-smoke",
              dependencies: [
                  .package(url: "https://github.com/openwatersio/almanac.git", exact: "${version}")
              ],
              targets: [
                  .executableTarget(name: "almanac-smoke", dependencies: [.product(name: "Almanac", package: "almanac")])
              ]
          )
          EOF
          cat > Sources/almanac-smoke/main.swift <<'EOF'
          import Almanac
          import Foundation

          let illum = try moonIllumination(Date())
          print("moon illumination fraction: \(illum.fraction)")
          EOF
          swift run
  smoke-npm:
    needs: [tag-version, fixtures, typescript, swift, kotlin]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: typescript } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .github/mise.toml }
      - run: npm ci
      - run: npm pack
      - name: assert tarball contents
        run: |
          tarball="$(ls ./*.tgz)"
          for entry in package/NOTICE package/LICENSE package/README.md package/dist/index.js package/dist/index.d.ts; do
            if ! tar -tf "$tarball" | grep -qx "$entry"; then
              echo "tarball missing $entry" >&2
              exit 1
            fi
          done
      - name: Test packed ESM and CommonJS loading on Node 24
        run: node ../.github/scripts/smoke-npm.mjs ./*.tgz
      - uses: actions/setup-node@v7
        with: { node-version: '22.12.0' }
      - name: Test packed ESM and CommonJS loading on Node 22.12
        run: node ../.github/scripts/smoke-npm.mjs ./*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: almanac-npm-tarball
          path: typescript/*.tgz
  publish:
    needs: [smoke-swiftpm, smoke-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .github/mise.toml }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: almanac-npm-tarball
      - run: npm publish ./*.tgz --provenance --access public
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      # A hand-written release for the tag wins; this only guarantees one exists.
      - run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
