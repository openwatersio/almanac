name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fixtures/generate/derive.mjs --check
  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
