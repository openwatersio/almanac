name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # Which suites a pull request actually needs.
  #
  # NOT an `on.paths` filter: `typescript`, `swift`, `kotlin` and `fixtures` are required
  # status checks on main, and a workflow skipped by path filtering never
  # reports them at all — the pull request then waits on a status that can
  # never arrive. Skipping at the job level instead leaves a `skipped`
  # conclusion, which does satisfy a required check.
  #
  # Pushes to main are never filtered: that is once per merge, and it keeps
  # this job off the `github.event.before` edge cases (new branch, force push).
  changes:
    runs-on: ubuntu-26.04
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      swift: ${{ steps.filter.outputs.swift }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: mise.toml }
      - run: node --test .github/ci-routes.test.mjs
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/ci-routes.mjs
  # Unconditional: 7 seconds, cheaper to run than to reason about skipping.
  fixtures:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: mise.toml }
      - run: node fixtures/generate/derive.mjs --check
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-26.04
    defaults: { run: { working-directory: typescript } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: mise.toml }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack
      - run: node ../fixtures/generate/parity.mjs --check "$GITHUB_SHA" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: almanac-npm-tarball
          path: typescript/*.tgz
  smoke-npm:
    needs: typescript
    runs-on: ubuntu-26.04
    strategy:
      matrix: { node: ['22.12.0', '24'] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - uses: actions/download-artifact@v8
        with:
          name: almanac-npm-tarball
          path: npm-tarball
      - run: node .github/scripts/smoke-npm.mjs npm-tarball/*.tgz
  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: swift test -c release
  kotlin:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-26.04
    defaults: { run: { working-directory: kotlin } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - run: ./gradlew -p smoke run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-reports
          path: |
            kotlin/build/reports
            kotlin/build/test-results
  # Slackwater's watch app links Almanac. Apple Watch hardware is arm64_32, where
  # Swift's Int is 32 bits, so the device slice is the one that can break; the
  # simulator slice is what the app's own CI compiles against. Compile-only: the
  # suite's results are the same on every 64-bit target and the Linux job runs it.
  watchos:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile for Apple Watch
        run: swift build -c release --target Almanac --scratch-path .build-watch --triple arm64_32-apple-watchos9.0 --sdk "$(xcrun --sdk watchos --show-sdk-path)"
      - name: Compile for the watch simulator
        run: swift build -c release --target Almanac --scratch-path .build-watchsim --triple arm64-apple-watchos9.0-simulator --sdk "$(xcrun --sdk watchsimulator --show-sdk-path)"
  performance-typescript:
    name: performance (typescript, ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    permissions: { contents: read }
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env: { PORT: typescript }
    steps: &performance-steps
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: mise.toml }
      - if: env.PORT == 'typescript'
        run: npm ci --prefix typescript
      - run: node --test benchmarks/compare.test.mjs
      - name: Compare base and candidate on the same runner
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          skip=()
          if ! git grep -q -F 'public func planetEvents(' "$BASE" -- swift/Sources/Almanac/Events.swift; then
            skip+=('planets')
          fi
          if ! git grep -q -F 'public func sunTransits(' "$BASE" -- swift/Sources/Almanac/Events.swift; then
            skip+=('suncalc')
          fi
          if ! git cat-file -e "$BASE:swift/Sources/Almanac/Seasons.swift" 2>/dev/null; then
            skip+=('cycles')
          fi
          if ! git grep -q -F 'public func starPosition(' "$BASE" -- swift/Sources/Almanac/Positions.swift; then
            skip+=('stars')
          fi
          args=()
          if [ ${#skip[@]} -gt 0 ]; then
            args+=(--skip "^($(IFS='|'; echo "${skip[*]}"))/")
          fi
          node benchmarks/run.mjs --base "$BASE" --port "$PORT" --output benchmark-results "${args[@]}"
      - name: Publish timing table
        if: always()
        run: |
          if [ -f benchmark-results/summary.md ]; then
            cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ env.PORT }}
          path: benchmark-results
          retention-days: 30
  performance-swift:
    name: performance (swift, ubuntu-latest)
    # Shared changes run Swift after TypeScript; Swift-only changes run directly.
    needs: [changes, performance-typescript]
    if: always() && needs.changes.outputs.swift == 'true' && (needs.performance-typescript.result == 'success' || needs.performance-typescript.result == 'skipped')
    permissions: { contents: read }
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env: { PORT: swift }
    steps: *performance-steps
