name: Ubuntu 26.04 fresh Swift installation

on:
  pull_request:
    paths: [".github/workflows/ubuntu-cold-tools.yml"]

permissions:
  contents: read

jobs:
  fresh-swift:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Isolate mise data, downloads and state
        run: |
          test ! -e "$RUNNER_TEMP/ubuntu26-mise-data"
          echo "MISE_DATA_DIR=$RUNNER_TEMP/ubuntu26-mise-data" >> "$GITHUB_ENV"
          echo "MISE_CACHE_DIR=$RUNNER_TEMP/ubuntu26-mise-cache" >> "$GITHUB_ENV"
          echo "MISE_STATE_DIR=$RUNNER_TEMP/ubuntu26-mise-state" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.11"
          install_args: swift
          cache: false
      - name: Verify the freshly installed compiler and run release tests
        shell: bash
        run: |
          set -euo pipefail
          swift_path="$(mise which swift)"
          case "$swift_path" in
            "$MISE_DATA_DIR"/installs/swift/*) ;;
            *) echo "Unexpected Swift path: $swift_path" >&2; exit 1 ;;
          esac
          mise exec swift -- swift --version
          mise exec swift -- swift test -c release
      - name: Verify the documented reinstall commands
        run: |
          mise uninstall swift@6.4.0
          mise install swift
          mise exec swift -- swift --version
          mise exec swift -- swift test -c release
